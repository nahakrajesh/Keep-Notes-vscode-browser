<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>Notepad Keeper</title>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
      </div>
      <span class="header-title">Notepad Keeper</span>
      <div class="status" id="status" title="Checking connection...">
        <span class="status-dot"></span>
      </div>
    </div>

    <!-- Note Form -->
    <div class="form">
      <input type="text" id="noteTitle" placeholder="Title" autocomplete="off" />
      <textarea id="noteContent" placeholder="Write your note..." rows="5"></textarea>

      <!-- Color Picker -->
      <div class="color-section">
        <span class="color-label">Color</span>
        <div class="color-picker" id="colorPicker"></div>
      </div>

      <!-- Pin Toggle -->
      <label class="pin-toggle" id="pinToggle">
        <input type="checkbox" id="pinCheck" />
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path d="M9.828.722a.5.5 0 0 1 .354.146l4.95 4.95a.5.5 0 0 1-.707.708l-.565-.566-2.475 2.475a3 3 0 0 1-.126 3.59l-.05.06-.036.043-4.95-4.95.043-.037.06-.05a3 3 0 0 1 3.59-.125L12.39 4.5l-.566-.566a.5.5 0 0 1 .146-.708L9.828.722zM2.5 13.5l4-4 1 1-4 4-1.5.5.5-1.5z"/>
        </svg>
        <span>Pin this note</span>
      </label>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-save" id="btnSave">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Save to Notepad
      </button>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Recent Notes -->
    <div class="recent" id="recentSection" style="display:none">
      <div class="recent-header">
        <span>Recent Notes</span>
        <button class="btn-text" id="btnViewAll">View all in VS Code</button>
      </div>
      <div class="recent-list" id="recentList"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
